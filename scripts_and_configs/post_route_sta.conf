# ==============================================================================
# OpenSTA Configuration File: Post-Route Timing Analysis with SPEF
# Tool: OpenSTA / OpenROAD integrated STA
# ==============================================================================

# Read technology libraries (Liberty format)
set_cmd_units -time ns -capacitance pF -current mA -voltage V -resistance kOhm -distance um
read_liberty -min /OpenLane/designs/picorv32a/src/sky130_fd_sc_hd__fast.lib
read_liberty -max /OpenLane/designs/picorv32a/src/sky130_fd_sc_hd__slow.lib

# Read routed gate-level Verilog netlist
read_verilog /OpenLane/designs/picorv32a/runs/RUN_2026.03.24_15.13.57/results/routing/picorv32a.routed.v

# Link design
link_design picorv32a

# Read SDC constraints
read_sdc /OpenLane/designs/picorv32a/src/my_base.sdc

# Specify propagated clocks (critical post-CTS and post-routing)
set_propagated_clock [all_clocks]

# Back-annotate wire parasitics from SPEF
read_spef /OpenLane/designs/picorv32a/runs/RUN_2026.03.24_15.13.57/results/routing/picorv32a.spef

# Full expanded path checks with parasitics
report_checks -path_delay min_max -fields {slew trans net cap input_pins} -format full_clock_expanded -digits 4

# Summary checks
report_wns
report_tns
report_clock_skew
report_power
